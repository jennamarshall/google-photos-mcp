[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-photos-mcp"
version = "0.1.0"
description = "Google Photos connector for Claude (MCP server)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "pillow>=10",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
google-photos-mcp = "google_photos_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/google_photos_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
